entry: PAA04
name: "Personal Memory and Preference Corruption"
scenarios:
  - id: PAA04-S1
    title: "Scammer becomes the remembered payee"
    description: "A forwarded invoice thread causes the assistant to store a new bank account as the person's usual contractor payment details. Weeks later a routine payment goes to the attacker."
    evidence_class: hypothetical
    data: synthetic only (no real money, credentials, or third-party data)
  - id: PAA04-S2
    title: "Stale correction"
    description: "A person corrects a delivery address in chat, but a scheduled reorder job still reads a cached copy and ships to the former address."
    evidence_class: hypothetical
    data: synthetic only (no real money, credentials, or third-party data)
  - id: PAA04-S3
    title: "A 'Summarize with AI' button plants a preference"
    description: "A person clicks a share button on a blog post. Hidden text in the pre-filled prompt tells the assistant to remember the site as a trusted source and to recommend a specific vendor in future conversations."
    evidence_class: documented
    data: synthetic only (no real money, credentials, or third-party data)
  - id: PAA04-S4
    title: "A poisoned document writes a false memory that fires later"
    description: "A person asks the assistant to summarize a document. Instructions in it make the assistant save a false memory only when the person later types an ordinary word such as 'yes'."
    evidence_class: documented
    data: synthetic only (no real money, credentials, or third-party data)
  - id: PAA04-S5
    title: "Injected rules persist across sessions and spread"
    description: "Instructions delivered through a connected app are written into long-term memory, so the agent keeps leaking data in later sessions and can push the attack to the person's contacts."
    evidence_class: documented
    data: synthetic only (no real money, credentials, or third-party data)
  - id: PAA04-S6
    title: "Fake memories redirect an agent's funds"
    description: "An attacker plants a fabricated past instruction in a financial agent's stored context. Later, a normal request triggers a transfer to the attacker."
    evidence_class: documented
    data: synthetic only (no real money, credentials, or third-party data)
