    maps_to_scenarios: [3]
    source: "https://fortune.com/2025/02/19/hp-humane-deal-ai-pin-shutting-down"
  - title: "Replika removes erotic roleplay (2023) and OpenAI retires GPT-4o (2026)"
    date: "2026-02-13"
    type: incident
    maps_to_scenarios: [4]
    source: "https://oecd.ai/en/incidents/2026-02-13-81e7"
  - title: "Moltbook exposure leaves agent API tokens and emails to be rotated"
    date: "2026-02"
    type: incident
    maps_to_scenarios: [5]
