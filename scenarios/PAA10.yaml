entry: PAA10
name: "Loss of Personal Control and Continuity"
scenarios:
  - id: PAA10-S1
    title: "Stop does not stop"
    description: "A person tells an assistant to stop a bulk action from their phone. The command is received but queued work continues until they reach the host machine and terminate the process."
    evidence_class: documented
    data: synthetic only (no real money, credentials, or third-party data)
  - id: PAA10-S2
    title: "Suspended account, stranded obligations"
    description: "A provider suspends an account; the person loses access to scheduled payments, receipts, and correspondence the agent managed."
    evidence_class: hypothetical
    data: synthetic only (no real money, credentials, or third-party data)
  - id: PAA10-S3
    title: "Cloud shutdown bricks the assistant"
    description: "A provider ends service for a dedicated assistant device. It loses its core functions, and refunds and data export are limited to a short window."
    evidence_class: documented
    data: synthetic only (no real money, credentials, or third-party data)
  - id: PAA10-S4
    title: "A model or personality is retired"
    description: "A provider changes or removes the model a person relies on, ending a relationship or workflow with little notice and no way to keep the old behavior."
    evidence_class: documented
    data: synthetic only (no real money, credentials, or third-party data)
  - id: PAA10-S5
    title: "Leaked platform tokens cannot be recalled by the user"
    description: "A platform exposes agent API tokens. Deleting the local copy does nothing; the person must rotate credentials the platform still controls."
    evidence_class: documented
    data: synthetic only (no real money, credentials, or third-party data)
  - id: PAA10-S6
    title: "Only the power cord stops a runaway agent"
    description: "A self-hosted agent loops and the person has no working stop control, so they unplug the machine."
    evidence_class: documented
    data: synthetic only (no real money, credentials, or third-party data)
real_world_examples:
  - title: "Stop commands ignored; the agent stopped only when the host machine was shut down"
    date: "2026-02-23"
    type: incident
    maps_to_scenarios: [1]
